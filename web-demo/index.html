<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Buddy - AI-Powered Study Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #4f46e5;
        }

        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            color: #6366f1;
            border: 2px solid #6366f1;
        }

        .btn-secondary:hover {
            background: #f3f4f6;
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #dc2626;
        }

        .success {
            background: #f0fdf4;
            color: #16a34a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #16a34a;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .card {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .flashcard {
            background: white;
            border: 3px solid #6366f1;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .flashcard:hover {
            transform: scale(1.02);
        }

        .flashcard-label {
            font-size: 0.9rem;
            color: #6366f1;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .flashcard-text {
            font-size: 1.3rem;
            color: #1f2937;
            line-height: 1.6;
        }

        .rating-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .rating-btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .rating-btn:hover {
            transform: translateY(-2px);
        }

        .rating-btn.again { background: #ef4444; color: white; }
        .rating-btn.hard { background: #f97316; color: white; }
        .rating-btn.good { background: #3b82f6; color: white; }
        .rating-btn.easy { background: #10b981; color: white; }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-buttons button {
            flex: 1;
        }

        .list-item {
            background: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e5e7eb;
        }

        .list-item h3 {
            color: #1f2937;
            margin-bottom: 5px;
        }

        .list-item p {
            color: #6b7280;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .rating-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Study Buddy</h1>
            <p>Your AI-Powered Study Companion</p>
        </div>

        <div class="content">
            <!-- Login Screen -->
            <div id="login-screen" class="screen active">
                <h2 style="margin-bottom: 20px;">Welcome Back!</h2>
                <div id="login-error"></div>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn">Login</button>
                    <button type="button" class="btn btn-secondary" onclick="showSignup()" style="margin-top: 10px;">
                        Create Account
                    </button>
                </form>
            </div>

            <!-- Signup Screen -->
            <div id="signup-screen" class="screen">
                <h2 style="margin-bottom: 20px;">Create Account</h2>
                <div id="signup-error"></div>
                <form id="signup-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="signup-name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signup-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signup-password" required minlength="6">
                    </div>
                    <button type="submit" class="btn">Sign Up</button>
                    <button type="button" class="btn btn-secondary" onclick="showLogin()" style="margin-top: 10px;">
                        Back to Login
                    </button>
                </form>
            </div>

            <!-- Home Dashboard -->
            <div id="home-screen" class="screen">
                <h2 style="margin-bottom: 20px;">Welcome, <span id="user-name"></span>!</h2>

                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="user-streak">0</div>
                        <div class="stat-label">🔥 Day Streak</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="user-level">1</div>
                        <div class="stat-label">⭐ Level</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="user-xp">0</div>
                        <div class="stat-label">⚡ XP</div>
                    </div>
                </div>

                <div class="card">
                    <h3 style="margin-bottom: 15px;">📖 My Subjects</h3>
                    <div id="subjects-list">
                        <p style="color: #6b7280;">No subjects yet. Create one to get started!</p>
                    </div>
                    <button class="btn" onclick="showCreateSubject()" style="margin-top: 15px;">+ Add Subject</button>
                </div>

                <div class="nav-buttons">
                    <button class="btn" onclick="showFlashcardReview()">📝 Review Flashcards</button>
                    <button class="btn btn-secondary" onclick="logout()">Logout</button>
                </div>
            </div>

            <!-- Create Subject -->
            <div id="create-subject-screen" class="screen">
                <h2 style="margin-bottom: 20px;">Create New Subject</h2>
                <form id="create-subject-form">
                    <div class="form-group">
                        <label>Subject Name</label>
                        <input type="text" id="subject-name" required placeholder="e.g., Biology">
                    </div>
                    <div class="form-group">
                        <label>Description (optional)</label>
                        <input type="text" id="subject-description" placeholder="e.g., High school biology">
                    </div>
                    <button type="submit" class="btn">Create Subject</button>
                    <button type="button" class="btn btn-secondary" onclick="showHome()" style="margin-top: 10px;">
                        Cancel
                    </button>
                </form>
            </div>

            <!-- Flashcard Review -->
            <div id="flashcard-screen" class="screen">
                <h2 style="margin-bottom: 20px;">Flashcard Review</h2>

                <div id="flashcard-content">
                    <div class="flashcard" onclick="flipCard()">
                        <div class="flashcard-label" id="flashcard-label">Question</div>
                        <div class="flashcard-text" id="flashcard-text">
                            Click to start review...
                        </div>
                    </div>

                    <div id="rating-section" style="display: none;">
                        <p style="text-align: center; margin-bottom: 10px; color: #6b7280;">How well did you remember?</p>
                        <div class="rating-buttons">
                            <button class="rating-btn again" onclick="rate('AGAIN')">Again</button>
                            <button class="rating-btn hard" onclick="rate('HARD')">Hard</button>
                            <button class="rating-btn good" onclick="rate('GOOD')">Good</button>
                            <button class="rating-btn easy" onclick="rate('EASY')">Easy</button>
                        </div>
                    </div>
                </div>

                <button class="btn btn-secondary" onclick="showHome()" style="margin-top: 20px;">
                    Back to Home
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
